<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spring Boot Data Viewer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
    }
    .data-container {
      margin: 20px;
    }
    .data-section {
      margin-bottom: 30px;
    }
  </style>
</head>
<body>
  <h1>Data Viewer</h1>
  <div class="data-container">
    <div class="data-section">
      <h2>Locations</h2>
      <button onclick="fetchData('/locations', 'locations')">Load Locations</button>
      <ul id="locations"></ul>
    </div>
    <div class="data-section">
      <h2>Members</h2>
      <button onclick="fetchData('/members', 'members')">Load Members</button>
      <ul id="members"></ul>
    </div>
    <div class="data-section">
      <h2>Tutorials</h2>
      <button onclick="fetchData('/tutorials', 'tutorials')">Load Tutorials</button>
      <ul id="tutorials"></ul>
    </div>
  </div>

  <script>
    const baseUrl = 'http://localhost:8081'; // Update this to match your backend URL

    function fetchData(endpoint, containerId) {
      fetch(baseUrl + endpoint)
        .then(response => {
          if (!response.ok) {
            throw new Error('Network response was not ok ' + response.statusText);
          }
          return response.json();
        })
        .then(data => {
          const container = document.getElementById(containerId);
          container.innerHTML = ''; // Clear previous content
          data.forEach(item => {
            const li = document.createElement('li');
            li.textContent = JSON.stringify(item, null, 2);
            container.appendChild(li);
          });
        })
        .catch(error => {
          console.error('There was a problem with the fetch operation:', error);
        });
    }
  </script>
</body>
</html>
