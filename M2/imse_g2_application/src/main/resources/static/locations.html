<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locations</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f4f4f4;
        }
    </style>
</head>
<body>
    <h1>Locations</h1>
    <table>
        <thead>
            <tr>
                <th>Location ID</th>
                <th>Manager Name</th>
                <th>Address</th>
            </tr>
        </thead>
        <tbody id="locations-table-body">
            <!-- Location rows will be dynamically inserted here -->
        </tbody>
    </table>

    <script>
        // Fetch data from the backend endpoint and populate the table
        async function fetchLocations() {
            try {
                // Use the correct backend URL
                const response = await fetch('http://localhost:8081/api/public/locations');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const locations = await response.json();

                const tableBody = document.getElementById('locations-table-body');
                tableBody.innerHTML = ''; // Clear any existing rows

                // Populate the table with fetched data
                locations.forEach(location => {
                    const row = document.createElement('tr');

                    const idCell = document.createElement('td');
                    idCell.textContent = location.locationId;
                    row.appendChild(idCell);

                    const managerCell = document.createElement('td');
                    managerCell.textContent = location.managerName;
                    row.appendChild(managerCell);

                    const addressCell = document.createElement('td');
                    addressCell.textContent = location.address;
                    row.appendChild(addressCell);

                    tableBody.appendChild(row);
                });
            } catch (error) {
                console.error('Error fetching locations:', error);
                alert('Failed to fetch locations. Please try again later.');
            }
        }

        // Call the function to fetch and display locations when the page loads
        window.onload = fetchLocations;
    </script>
</body>
</html>
