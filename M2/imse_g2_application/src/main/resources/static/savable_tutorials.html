<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutorials</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f4f4f4;
        }
        .video-details {
            font-size: 0.9em;
            color: #555;
        }
        button {
            padding: 5px 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <h1>List of Tutorials</h1>
    <table>
        <thead>
            <tr>
                <th>Tutorial ID</th>
                <th>Name</th>
                <th>Muscle Group</th>
                <th>Difficulty Level</th>
                <th>Description</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="tutorials-table-body">
            <!-- Tutorial rows will be dynamically inserted here -->
        </tbody>
    </table>

    <script>
        // Fetch tutorials from the backend and populate the table
        async function fetchTutorials() {
            try {
                const response = await fetch('http://localhost:8081/api/public/tutorials');
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }

                const tutorials = await response.json();
                const tableBody = document.getElementById('tutorials-table-body');
                tableBody.innerHTML = ''; // Clear any existing rows

                tutorials.forEach(tutorial => {
                    const row = document.createElement('tr');

                    // Tutorial ID
                    const idCell = document.createElement('td');
                    idCell.textContent = tutorial.tutorialId;
                    row.appendChild(idCell);

                    // Name
                    const nameCell = document.createElement('td');
                    nameCell.textContent = tutorial.name;
                    row.appendChild(nameCell);

                    // Muscle Group
                    const muscleGroupCell = document.createElement('td');
                    muscleGroupCell.textContent = tutorial.muscleGroup;
                    row.appendChild(muscleGroupCell);

                    // Difficulty Level
                    const difficultyLevelCell = document.createElement('td');
                    difficultyLevelCell.textContent = tutorial.difficultyLevel;
                    row.appendChild(difficultyLevelCell);

                    // Description and Video Tutorial Details
                    const descriptionCell = document.createElement('td');
                    descriptionCell.textContent = tutorial.description;

					// Check if the tutorial is a VideoTutorial (if `duration` and `url` are present)
					if ('duration' in tutorial && 'url' in tutorial) {
						const videoDetails = document.createElement('div');
						videoDetails.classList.add('video-details');
						videoDetails.innerHTML = `
							<p><strong>Duration:</strong> ${tutorial.duration} mins</p>
							<p><strong>URL:</strong> <a href="${tutorial.url}" target="_blank">${tutorial.url}</a></p>
						`;
						descriptionCell.appendChild(videoDetails);
					}
					row.appendChild(descriptionCell);

                    // Actions (Save Button)
                    const actionsCell = document.createElement('td');
                    const saveButton = document.createElement('button');
                    saveButton.textContent = 'Save';
                    saveButton.onclick = () => saveTutorial(tutorial);
                    actionsCell.appendChild(saveButton);
                    row.appendChild(actionsCell);

                    tableBody.appendChild(row);
                });
            } catch (error) {
                console.error('Error fetching tutorials:', error);
                alert('Failed to fetch tutorials. Please try again later.');
            }
        }

        // Save a tutorial by sending a POST request to the backend
        async function saveTutorial(tutorial) {
            try {
                const response = await fetch('http://localhost:8081/api/member/save_tutorial', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(tutorial),
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }

                const result = await response.text();
                alert(`${result} You can manage saved tutorials under "My Data"`);
            } catch (error) {
                console.error('Error saving tutorial:', error);
                alert('Failed to save tutorial. Please try again later.');
            }
        }

        // Fetch and display tutorials on page load
        window.onload = fetchTutorials;
    </script>
</body>
</html>
